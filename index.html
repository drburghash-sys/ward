*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#184333 0,transparent 34%),var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}body.light{background:linear-gradient(180deg,#fbf7ed,#efe7d7)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}

.ring{--p:0;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.08) 0);position:relative;flex:0 0 auto}.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}.ring b{position:relative;color:var(--gold2);font-size:18px}.heroMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{font-size:11px;color:var(--muted);padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.05)}

function getCount(sec,id,prayer,k){var d=ds(k);if(sec==='prayer')return ((d.prayer[prayer]||{})[id]||0);return ((d.sec[sec]||{})[id]||0)}
function setCount(sec,id,v,prayer){var d=ds();v=Math.max(0,v);if(sec==='prayer'){if(!d.prayer[prayer])d.prayer[prayer]={};d.prayer[prayer][id]=v}else{if(!d.sec[sec])d.sec[sec]={};d.sec[sec][id]=v}save()}
function stats(sec,prayer,k){var items=DATA[sec].items,total=0,done=0;items.forEach(function(i){total+=i.n;done+=Math.min(i.n,getCount(sec,i.id,prayer,k))});return{total:total,done:done,pct:total?Math.round(done/total*100):0,complete:done>=total}}
function overall(k){var arr=[stats('morning',null,k).complete,stats('evening',null,k).complete,stats('sleep',null,k).complete];PRAYERS.forEach(function(p){arr.push(stats('prayer',p[0],k).complete)});var n=arr.filter(Boolean).length;return{n:n,total:arr.length,pct:Math.round(n/arr.length*100),complete:n===arr.length}}
function card(sec,icon,title){var st=stats(sec);return '<button class="card" onclick="openSection(\''+sec+'\')"><div class="ico">'+icon+'</div><div class="title">'+title+'</div><div class="desc">'+st.done+' / '+st.total+'</div><div class="bar"><i style="width:'+st.pct+'%"></i></div></button>'}
function renderHome(){var o=overall(),h=new Date().getHours(),g=h<12?'صباح الخير':h<18?'مساء الخير':'مساء الطمأنينة',pd=PRAYERS.filter(function(p){return stats('prayer',p[0]).complete}).length;var w='';for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var x=overall(dk(d)),names=['ح','ن','ث','ر','خ','ج','س'];w+='<div class="day '+(x.complete?'done':'')+'"><b>'+names[d.getDay()]+'</b><small>'+d.getDate()+'</small></div>'}
q('#home').innerHTML='<div class="hero"><div class="heroRow"><div><div class="eyebrow">'+g+'</div><h1>وِرد اليوم</h1><div class="muted">تقدّم هادئ بلا نقاط أو منافسة.</div></div><div class="ring" style="--p:'+o.pct+'"><b>'+o.pct+'%</b></div></div><div class="heroMeta"><span class="pill">'+o.n+' من '+o.total+' أوراد مكتملة</span><span class="pill">الحفظ على هذا الجهاز</span></div></div><div class="head"><h2>أوراد اليوم</h2><span>اضغط للبدء</span></div><div class="grid">'+card('morning','☀️','أذكار الصباح')+card('evening','🌙','أذكار المساء')+'<button class="card" onclick="pickPrayer()"><div class="ico">🕌</div><div class="title">بعد الصلاة</div><div class="desc">'+pd+' من 5 صلوات</div><div class="bar"><i style="width:'+(pd*20)+'%"></i></div></button>'+card('sleep','🛏️','أذكار النوم')+'</div><div class="head"><h2>آخر 7 أيام</h2><span>إنجاز كامل لليوم</span></div><div class="week">'+w+'</div><div class="head"><h2>اختصار سريع</h2><span>مسبحة فورية</span></div><button class="card" style="width:100%" onclick="goTas100()"><div class="ico">📿</div><div class="title">سبحان الله وبحمده ×100</div><div class="desc">يفتح مباشرة في المسبحة</div></button>'}
function openSheet(html){q('#sheetBody').innerHTML=html;q('#sheet').classList.remove('hidden');document.body.style.overflow='hidden'}
function closeSheet(){q('#sheet').classList.add('hidden');document.body.style.overflow='';reader=null}
function pickPrayer(){var h='<div class="readerTop"><div><h2>أذكار بعد الصلاة</h2><div class="muted">اختر الصلاة</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="grid" style="margin-top:14px">';PRAYERS.forEach(function(p){var s=stats('prayer',p[0]);h+='<button class="card" onclick="openSection(\'prayer\',\''+p[0]+'\')"><div class="title">'+p[1]+'</div><div class="desc">'+(s.complete?'مكتمل ✓':s.pct+'%')+'</div></button>'});openSheet(h+'</div>')}
function openSection(sec,prayer){reader={sec:sec,prayer:prayer||null,index:0};renderReader()}
function renderReader(){var sec=reader.sec,item=DATA[sec].items[reader.index],c=getCount(sec,item.id,reader.prayer),p=reader.index+1;var prayerName='';if(reader.prayer){var hit=PRAYERS.find(function(x){return x[0]===reader.prayer});prayerName=hit?' — '+hit[1]:''}openSheet('<div class="readerTop"><div><h2>'+esc(DATA[sec].title)+prayerName+'</h2><div class="muted">'+p+' من '+DATA[sec].items.length+'</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="dhikr dhikrTap" onclick="readerPlus()" role="button" tabindex="0"><div class="dhikrText">'+esc(item.text)+'</div><div class="dhikrCount"><b dir="ltr">'+c+' / '+item.n+'</b><span>'+(c>=item.n?'اكتمل ✓':'اضغط على الذكر للعد')+'</span></div></div><div class="source"><b>المصدر:</b> '+esc(item.src)+'</div><div class="controls"><button class="btn" onclick="readerNav(-1)">السابق</button><button class="btn primary" onclick="readerNav(1)">التالي</button><button class="btn" onclick="closeSheet()">إغلاق</button></div>')}
function readerPlus(){var it=DATA[reader.sec].items[reader.index],c=getCount(reader.sec,it.id,reader.prayer);if(c<it.n){setCount(reader.sec,it.id,c+1,reader.prayer);vibrate(c+1===it.n?[20,35,20]:10)}renderReader();renderHome()}
function readerNav(d){var max=DATA[reader.sec].items.length-1;if(d>0&&reader.index===max){var s=stats(reader.sec,reader.prayer);closeSheet();renderHome();toast(s.complete?'اكتمل الورد ✓':'بقيت أذكار غير مكتملة');return}reader.index=Math.max(0,Math.min(max,reader.index+d));renderReader()}
function setMode(m){tas.mode=m;tas.count=0;tas.stage=0;tas.customId=null;if(m==='post'){tas.phrase='سُبْحَانَ اللَّهِ';tas.target=33}else if(m==='33')tas.target=33;else if(m==='100')tas.target=100;else if(m==='custom')tas.target=tas.customTarget;else tas.target=Infinity;renderTas()}
function renderTas(){var opts='';PHRASES.forEach(function(p){opts+='<option '+(p===tas.phrase?'selected':'')+'>'+esc(p)+'</option>'});q('#tasbih').innerHTML='<div class="pageTitle"><h1>المسبحة</h1><p>المس البطاقة الكبيرة للعد. زر التراجع يعالج الضغطة الخاطئة.</p></div><div class="segment"><button data-m="post" onclick="setMode(\'post\')">بعد الصلاة</button><button data-m="33" onclick="setMode(\'33\')">33</button><button data-m="100" onclick="setMode(\'100\')">100</button><button data-m="custom" onclick="setMode(\'custom\')">مخصص</button><button data-m="inf" onclick="setMode(\'inf\')">∞</button></div><div class="selectRow"><select onchange="tas.phrase=this.value;tas.count=0;tas.stage=0;renderTas()">'+opts+'</select><button class="smallBtn" onclick="state.haptic=!state.haptic;save();renderTas()">'+(state.haptic?'اهتزاز ✓':'اهتزاز ✕')+'</button></div>'+(tas.mode==='custom'?'<div class="selectRow"><input id="ct" class="input" type="number" min="1" max="10000" value="'+tas.customTarget+'"><button class="smallBtn" onclick="applyTarget()">تطبيق</button></div>':'')+'<div class="tasWrap"><div class="tasCard" onclick="tasPlus()"><div class="phrase">'+esc(tas.phrase)+'</div><div class="count">'+tas.count+'</div><div class="target">'+(tas.mode==='inf'?'بلا حد':'من '+tas.target)+(tas.mode==='post'?' • المرحلة '+(tas.stage+1)+'/3':'')+'</div><div class="tap">المس للعد</div></div><div class="controls"><button class="btn" onclick="tasUndo()">↶ تراجع</button><button class="btn danger" onclick="tasReset()">إعادة</button><button class="btn" onclick="switchView(\'home\')">وردي</button></div></div>';qa('[data-m]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-m')===tas.mode)})}
function applyTarget(){var n=Math.max(1,Math.min(10000,Number(q('#ct').value)||1));tas.customTarget=n;tas.target=n;tas.count=0;renderTas()}
function tasPlus(){if(tas.mode==='inf'){tas.count++;vibrate(8);renderTas();return}if(tas.count>=tas.target){toast('اكتمل العدد');return}tas.count++;vibrate(tas.count===tas.target?[22,35,22]:8);if(tas.customId){ds().custom[tas.customId]=tas.count;save()}if(tas.mode==='post'&&tas.count===tas.target){if(tas.stage<2){var a=[['سُبْحَانَ اللَّهِ',33],['الْحَمْدُ لِلَّهِ',33],['اللَّهُ أَكْبَرُ',34]];tas.stage++;tas.phrase=a[tas.stage][0];tas.target=a[tas.stage][1];tas.count=0;toast('انتقل للذكر التالي')}else toast('اكتمل التسبيح بعد الصلاة ✓')}renderTas();renderCustom()}
function tasUndo(){if(tas.count>0)tas.count--;else if(tas.mode==='post'&&tas.stage>0){var a=[['سُبْحَانَ اللَّهِ',33],['الْحَمْدُ لِلَّهِ',33],['اللَّهُ أَكْبَرُ',34]];tas.stage--;tas.phrase=a[tas.stage][0];tas.target=a[tas.stage][1];tas.count=tas.target}if(tas.customId){ds().custom[tas.customId]=tas.count;save()}renderTas();renderCustom()}
function tasReset(){tas.count=0;tas.stage=0;if(tas.mode==='post'){tas.phrase='سُبْحَانَ اللَّهِ';tas.target=33}if(tas.customId){ds().custom[tas.customId]=0;save()}renderTas();renderCustom()}
function goTas100(){tas.mode='100';tas.phrase='سُبْحَانَ اللَّهِ وَبِحَمْدِهِ';tas.target=100;tas.count=0;switchView('tasbih')}
function allItems(){var a=[];Object.keys(DATA).forEach(function(k){DATA[k].items.forEach(function(i){a.push({id:i.id,cat:DATA[k].title,title:i.title,text:i.text,n:i.n,src:i.src})})});return a.concat(EXTRA)}
function renderLib(query){query=query||'';var s=query.trim().toLowerCase(),items=allItems().filter(function(i){return !s||(i.title+' '+i.text+' '+i.cat+' '+i.src).toLowerCase().indexOf(s)>=0}),h='';items.forEach(function(i){h+='<button class="item" onclick="openLib(\''+i.id+'\')"><h3>'+esc(i.title)+'</h3><p>'+esc(i.text.slice(0,100))+(i.text.length>100?'…':'')+'</p><div class="source">'+esc(i.src)+'</div><div style="margin-top:7px"><span class="badge">'+esc(i.cat)+'</span></div></button>'});q('#library').innerHTML='<div class="pageTitle"><h1>مكتبة الأذكار</h1><p>ابحث بالذكر أو المناسبة أو المصدر.</p></div><div class="search"><input class="input" value="'+esc(query)+'" oninput="renderLib(this.value)" placeholder="مثال: النوم، مسلم، الاستغفار"></div><div class="list">'+(h||'<div class="empty">لا توجد نتائج</div>')+'</div>'}
function openLib(id){var i=allItems().find(function(x){return x.id===id});if(!i)return;openSheet('<div class="readerTop"><div><h2>'+esc(i.title)+'</h2><div class="muted">'+esc(i.cat)+' • التكرار الوارد: '+i.n+'</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="dhikr">'+esc(i.text)+'</div><div class="source"><b>المصدر:</b> '+esc(i.src)+'</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="startFromLib(\''+i.id+'\')">فتح في المسبحة</button>')}
function startFromLib(id){var i=allItems().find(function(x){return x.id===id});closeSheet();tas.mode='custom';tas.phrase=i.text;tas.customTarget=i.n;tas.target=i.n;tas.count=0;tas.stage=0;switchView('tasbih')}
function renderCustom(){var h='';state.custom.forEach(function(x){var c=ds().custom[x.id]||0,p=Math.min(100,Math.round(c/x.n*100));h+='<div class="item"><h3>'+esc(x.text)+'</h3><p><span class="badge">عدد شخصي</span> &nbsp; '+c+' / '+x.n+'</p><div class="bar"><i style="width:'+p+'%"></i></div><div class="controls"><button class="btn primary" onclick="startCustom(\''+x.id+'\')">ابدأ</button><button class="btn danger" onclick="delCustom(\''+x.id+'\')">حذف</button><button class="btn" onclick="resetCustom(\''+x.id+'\')">تصفير</button></div></div>'});q('#custom').innerHTML='<div class="pageTitle"><h1>وردي الخاص</h1><p>الأعداد هنا يحددها المستخدم، وتظهر بوضوح كـ <b>عدد شخصي</b> وليست عددًا منسوبًا للسنة.</p></div><div class="customForm"><input id="cp" class="input full" placeholder="اكتب الذكر"><input id="cn" class="input" type="number" min="1" max="10000" value="100"><button class="btn primary" onclick="addCustom()">إضافة</button></div><div class="list">'+(h||'<div class="empty">لم تضف وردًا شخصيًا بعد.</div>')+'</div>'}
function addCustom(){var t=q('#cp').value.trim(),n=Math.max(1,Math.min(10000,Number(q('#cn').value)||1));if(!t){toast('اكتب الذكر أولًا');return}state.custom.push({id:'c'+Date.now(),text:t,n:n});save();renderCustom();toast('أضيف إلى وردك الخاص')}
function delCustom(id){state.custom=state.custom.filter(function(x){return x.id!==id});delete ds().custom[id];save();renderCustom()}
function resetCustom(id){ds().custom[id]=0;save();renderCustom()}
function startCustom(id){var x=state.custom.find(function(y){return y.id===id});if(!x)return;tas.mode='custom';tas.phrase=x.text;tas.customTarget=x.n;tas.target=x.n;tas.count=ds().custom[id]||0;tas.stage=0;tas.customId=id;switchView('tasbih')}
function switchView(v){qa('.view').forEach(function(x){x.classList.toggle('active',x.id===v)});qa('.nav').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-view')===v)});if(v==='home')renderHome();if(v==='tasbih')renderTas();if(v==='library')renderLib();if(v==='custom')renderCustom();window.scrollTo({top:0,behavior:'smooth'})}
function applyTheme(){document.body.classList.toggle('light',state.theme==='light');q('#theme').textContent=state.theme==='light'?'☾':'◐'}
qa('.nav').forEach(function(b){b.addEventListener('click',function(){switchView(b.getAttribute('data-view'))})});
q('#theme').addEventListener('click',function(){state.theme=state.theme==='light'?'dark':'light';save();applyTheme()});
q('#sheet').addEventListener('click',function(e){if(e.target.hasAttribute('data-close'))closeSheet()});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;q('#install').classList.remove('hidden')});
q('#install').addEventListener('click',async function(){if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;q('#install').classList.add('hidden')});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
applyTheme();renderHome();renderTas();renderLib();renderCustom();
</script>
</body>
</html>
